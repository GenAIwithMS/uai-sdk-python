name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.9"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          pipx install poetry
          poetry --version

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Install SDK in editable mode
        run: poetry install --no-interaction --with dev

      - name: Run Ruff linter
        run: poetry run ruff check src tests

      - name: Run Ruff formatter check
        run: poetry run ruff format --check src tests

      - name: Run MyPy type checker
        run: poetry run mypy src --ignore-missing-imports

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          pipx install poetry
          poetry --version

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Install SDK in editable mode
        run: poetry install --no-interaction --with dev

      - name: Run unit tests
        run: poetry run pytest tests/unit -v --cov=uai --cov-report=xml --cov-report=term

      - name: Run integration tests
        if: ${{ hashFiles('tests/integration/**/test_*.py') != '' }}
        run: poetry run pytest tests/integration -v --tb=short

      - name: Run performance regression tests
        if: ${{ hashFiles('tests/performance/**/test_*.py') != '' }}
        run: poetry run pytest tests/performance -v --tb=short
        env:
          UAI_PERF_MEMORY: "1"

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload coverage to GitHub
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          pipx install poetry
          poetry --version

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r <(poetry export -f requirements.txt --without-hashes)

      - name: Run bandit security check
        run: |
          poetry run bandit -r src/ -ll
